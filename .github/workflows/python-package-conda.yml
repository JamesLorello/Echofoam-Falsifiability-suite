name: Python package checks

on:
  push:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "flake8==7.3.0" build
      - name: Lint with flake8
        run: |
          # Stop on syntax errors, undefined names, and invalid scope declarations.
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Report existing style issues as warnings.
          python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: python -m pytest
      - name: Build source and wheel distributions
        run: python -m build
